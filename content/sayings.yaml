  title: Нақыл сөз
  body: "Сөз — ойдың айнасы. Ойсыз сөз — сөз болмайды. Ой жетілу мен тіл жетілу қатар жүреді."
  source: Жүсіпбек Аймауытов
  card:
    title: "Сөз — ойдың айнасы. Ойсыз сөз — сөз болмайды. Ой жетілу мен тіл жетілу қатар жүреді."
