  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Ана тілі — жүректің терең сырларын, басынан кешкен дәуірлерін, жанның барлық толқындарын ұрпақтан ұрпаққа жеткізіп сақтап отыратын қазына."
