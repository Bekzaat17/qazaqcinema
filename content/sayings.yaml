# Нақыл сөздер — авторлар қоғамдық игілікте (†1955-ке дейін); Момышұлы (†1982) — қысқа дәйексөз, автор көрсетілген.
# Абай — 37-ші қара сөзден (kk.wikibooks); қалғандары — zharar.com, bilim-all.kz, massaget.kz жинақтарынан.
# Форма saying: карточка (портрет + цитата) фото болып, мәтін — подпись. Портрет жоқ → инициал.

- slug: nakyl-01
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Адамның адамшылығы істі бастағандығынан білінеді, қалайша бітіргендігінен емес."
  source: Абай Құнанбайұлы
  card:
    title: "Адамның адамшылығы істі бастағандығынан білінеді, қалайша бітіргендігінен емес."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-02
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Көңілдегі көрікті ой ауыздан шыққанда өңі қашады."
  source: Абай Құнанбайұлы
  card:
    title: "Көңілдегі көрікті ой ауыздан шыққанда өңі қашады."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-03
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Кісіге біліміне қарай болыстық қыл; татымсызға қылған болыстық өзі адамды бұзады."
  source: Абай Құнанбайұлы
  card:
    title: "Кісіге біліміне қарай болыстық қыл; татымсызға қылған болыстық өзі адамды бұзады."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-04
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Әкесінің баласы — адамның дұшпаны. Адамның баласы — бауырың."
  source: Абай Құнанбайұлы
  card:
    title: "Әкесінің баласы — адамның дұшпаны. Адамның баласы — бауырың."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-05
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Ер артық сұраса да азға разы болады. Ез аз сұрар, артылтып берсең де разы болмас."
  source: Абай Құнанбайұлы
  card:
    title: "Ер артық сұраса да азға разы болады. Ез аз сұрар, артылтып берсең де разы болмас."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-06
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Өзің үшін еңбек қылсаң, өзі үшін оттаған хайуанның бірі боласың; адамдықтың қарызы үшін еңбек қылсаң, Алланың сүйген құлының бірі боласың."
  source: Абай Құнанбайұлы
  card:
    title: "Өзің үшін еңбек қылсаң, өзі үшін оттаған хайуанның бірі боласың; адамдықтың қарызы үшін еңбек қылсаң, Алланың сүйген құлының бірі боласың."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-07
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Адам баласын заман өсіреді, кімде-кім жаман болса, оның замандасының бәрі кінәлі."
  source: Абай Құнанбайұлы
  card:
    title: "Адам баласын заман өсіреді, кімде-кім жаман болса, оның замандасының бәрі кінәлі."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-08
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Дүниеде жалғыз қалған адам — адамның өлгені."
  source: Абай Құнанбайұлы
  card:
    title: "Дүниеде жалғыз қалған адам — адамның өлгені."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-09
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Үмітін үзбек — қайратсыздық. Қары қалың, қатты қыстың артынан көгі мол жақсы жаз келмеуші ме еді?"
  source: Абай Құнанбайұлы
  card:
    title: "Үмітін үзбек — қайратсыздық. Қары қалың, қатты қыстың артынан көгі мол жақсы жаз келмеуші ме еді?"
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-10
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Ашулы адамның сөзі аз болса, ыза, қуаты артында болғаны."
  source: Абай Құнанбайұлы
  card:
    title: "Ашулы адамның сөзі аз болса, ыза, қуаты артында болғаны."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-11
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Егер ісім өнсін десең, ретін тап."
  source: Абай Құнанбайұлы
  card:
    title: "Егер ісім өнсін десең, ретін тап."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-12
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Биік мансап — биік жартас: ерінбей еңбектеп жылан да шығады, екпіндеп ұшып қыран да шығады."
  source: Абай Құнанбайұлы
  card:
    title: "Биік мансап — биік жартас: ерінбей еңбектеп жылан да шығады, екпіндеп ұшып қыран да шығады."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-13
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Дүние — үлкен көл, заман — соққан жел, алдыңғы толқын — ағалар, артқы толқын — інілер, кезекпенен өлінер, баяғыдай көрінер."
  source: Абай Құнанбайұлы
  card:
    title: "Дүние — үлкен көл, заман — соққан жел, алдыңғы толқын — ағалар, артқы толқын — інілер, кезекпенен өлінер, баяғыдай көрінер."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-14
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Бақпен асқан патшадан мимен асқан қара артық; сақалын сатқан кәріден еңбегін сатқан бала артық."
  source: Абай Құнанбайұлы
  card:
    title: "Бақпен асқан патшадан мимен асқан қара артық; сақалын сатқан кәріден еңбегін сатқан бала артық."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-15
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Жаман дос — көлеңке: басыңды күн шалса, қашып құтыла алмайсың; басыңды бұлт алса, іздеп таба алмайсың."
  source: Абай Құнанбайұлы
  card:
    title: "Жаман дос — көлеңке: басыңды күн шалса, қашып құтыла алмайсың; басыңды бұлт алса, іздеп таба алмайсың."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-16
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Досы жоқпен сырлас, досы көппен сыйлас; қайғысыздан сақ бол, қайғылыға жақ бол."
  source: Абай Құнанбайұлы
  card:
    title: "Досы жоқпен сырлас, досы көппен сыйлас; қайғысыздан сақ бол, қайғылыға жақ бол."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-17
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Қайратсыз ашу — тұл, тұрлаусыз ғашық — тұл, шәкіртсіз ғалым — тұл."
  source: Абай Құнанбайұлы
  card:
    title: "Қайратсыз ашу — тұл, тұрлаусыз ғашық — тұл, шәкіртсіз ғалым — тұл."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-18
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Бағың өскенше тілеуіңді ел де тілейді, өзің де тілейсің; бағың өскен соң — өзің ғана тілейсің."
  source: Абай Құнанбайұлы
  card:
    title: "Бағың өскенше тілеуіңді ел де тілейді, өзің де тілейсің; бағың өскен соң — өзің ғана тілейсің."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-19
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Егерде есті кісілердің қатарында болғың келсе, күнінде бір мәртебе, болмаса жұмасында бір, ең болмаса айында бір, өзіңнен өзің есеп ал."
  source: Абай Құнанбайұлы
  card:
    title: "Егерде есті кісілердің қатарында болғың келсе, күнінде бір мәртебе, болмаса жұмасында бір, ең болмаса айында бір, өзіңнен өзің есеп ал."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-20
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Адамның адамшылығы — ақыл, ғылым, жақсы ата, жақсы ана, жақсы құрбы, жақсы ұстаздан болады."
  source: Абай Құнанбайұлы
  card:
    title: "Адамның адамшылығы — ақыл, ғылым, жақсы ата, жақсы ана, жақсы құрбы, жақсы ұстаздан болады."
    portrait: authors/abai.jpg
    label: Нақыл сөз
    subtitle: Абай Құнанбайұлы · 1845–1904
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-21
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Білгеніңнің жақсысын қыл, білмегенін біле бер."
  source: Шәкәрім Құдайбердіұлы
  card:
    title: "Білгеніңнің жақсысын қыл, білмегенін біле бер."
    portrait: authors/shakarim.jpg
    label: Нақыл сөз
    subtitle: Шәкәрім Құдайбердіұлы · 1858–1931
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-22
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Құр білген керек емес — білгенді іс қылған керек."
  source: Шәкәрім Құдайбердіұлы
  card:
    title: "Құр білген керек емес — білгенді іс қылған керек."
    portrait: authors/shakarim.jpg
    label: Нақыл сөз
    subtitle: Шәкәрім Құдайбердіұлы · 1858–1931
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-23
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Билік айтсаң — түзу кес, адалын айт."
  source: Шәкәрім Құдайбердіұлы
  card:
    title: "Билік айтсаң — түзу кес, адалын айт."
    portrait: authors/shakarim.jpg
    label: Нақыл сөз
    subtitle: Шәкәрім Құдайбердіұлы · 1858–1931
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-24
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Жүрегі таза адам қиянатқа бармайды."
  source: Шәкәрім Құдайбердіұлы
  card:
    title: "Жүрегі таза адам қиянатқа бармайды."
    portrait: authors/shakarim.jpg
    label: Нақыл сөз
    subtitle: Шәкәрім Құдайбердіұлы · 1858–1931
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-25
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Түзетуге именбе — тапсаң мінін."
  source: Шәкәрім Құдайбердіұлы
  card:
    title: "Түзетуге именбе — тапсаң мінін."
    portrait: authors/shakarim.jpg
    label: Нақыл сөз
    subtitle: Шәкәрім Құдайбердіұлы · 1858–1931
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-26
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Кей адамнан ит ілгері: достықты ұмытпайды, адал қызмет етеді."
  source: Шәкәрім Құдайбердіұлы
  card:
    title: "Кей адамнан ит ілгері: достықты ұмытпайды, адал қызмет етеді."
    portrait: authors/shakarim.jpg
    label: Нақыл сөз
    subtitle: Шәкәрім Құдайбердіұлы · 1858–1931
  image_credit: "Фото — Wikimedia Commons, қоғамдық игілік"

- slug: nakyl-27
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Дүние — алдамшы, өмір — қу деп елірме."
  source: Шәкәрім Құдайбердіұлы
  card:
    title: "Дүние — алдамшы, өмір — қу деп елірме."
    portrait: authors/shakarim.jpg
    label: Нақыл сөз
