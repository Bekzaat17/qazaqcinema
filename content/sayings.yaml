- slug: nakyl-94
  kind: saying
  topic: nakyl
  title: Нақыл сөз
  body: "Сен — ата-анаңның үмітісің. Сен қайталанбас тұлғасың, өз өміріңнің белсенді жасаушысысың, сондықтан өзіңе ғана сен."
