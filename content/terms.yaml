      - {term: "кереге", meaning: "қабырғаны құрайтын торлы қанаттар"}
      - {term: "бақан", meaning: "шаңырақты көтеретін ұзын сырық"}
      - {term: "сықырлауық", meaning: "ағаш есік"}
      - {term: "босаға", meaning: "есіктің екі жақ тіреуі"}
      - {term: "маңдайша", meaning: "есіктің үстіңгі ағашы"}
