- slug: terms-01
  kind: term_list
  topic: zhylqy
  title: "Жылқының жасына қарай атаулары"
  body: "Қазақ жылқыны жасына қарай әр жылы басқа сөзбен атайды:"
  image: terms/foal.jpg
  image_credit: "Фото: Zhanat Kulenov, Wikimedia Commons, CC BY-SA 3.0 igo"
  payload:
    items:
      - {term: "құлын", meaning: "туғаннан алты айға дейін"}
      - {term: "жабағы", meaning: "алты айдан бір жасқа дейін"}
      - {term: "тай", meaning: "бір жастан екі жасқа дейін"}
      - {term: "құнан", meaning: "екі-үш жастағы еркек жылқы"}
      - {term: "байтал", meaning: "екі-үш жастағы ұрғашы жылқы"}
      - {term: "дөнен", meaning: "үш-төрт жастағы жылқы"}
      - {term: "бесті", meaning: "бес жасқа толған жылқы"}
    note: "Бестіден кейін еркегі — ат (піштірілген) немесе айғыр, ұрғашысы — бие."

- slug: terms-02
