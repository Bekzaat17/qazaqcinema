- slug: terms-07
  kind: term_list
  topic: kiiz_ui
  title: "Киіз үйдің сүйегі"
  body: "Киіз үйдің ағаш қаңқасы — «сүйегі» — үш бөліктен тұрады:"
  image: terms/yurt.jpg
  image_credit: "Фото: Kunshuak asem, Wikimedia Commons, CC BY-SA 4.0"
  payload:
    items:
      - {term: "шаңырақ", meaning: "төбедегі дөңгелек — үйдің ұйтқысы, отбасы символы"}
