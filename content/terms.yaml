      - {term: "тұлпар", meaning: "жүйрік, бәйге аты"}
      - {term: "арғымақ", meaning: "асыл тұқымды, сымбатты ат"}
      - {term: "жорға", meaning: "аяғын жорғалатып жүретін ат"}

- slug: terms-03
  kind: term_list
  topic: zhylqy
  title: "Жылқының түстері"
  body: "Жылқы түсінің әрқайсысының өз аты бар:"
  image: terms/horses.jpg
  image_credit: "Фото: Radosław Botev, Wikimedia Commons, CC BY 3.0 pl"
  payload:
    items:
      - {term: "торы", meaning: "қоңыр-қызыл, жалы мен құйрығы қара"}
      - {term: "жирен", meaning: "қызғылт-сары"}
      - {term: "қара", meaning: "қап-қара"}
      - {term: "ақ боз", meaning: "ақ, аппақ"}
      - {term: "көк", meaning: "сұр, күлгін реңді"}
      - {term: "құла", meaning: "сарғыш, жалы мен құйрығы қара"}
      - {term: "кер", meaning: "қоңырқай, қара сарғыш"}
      - {term: "шабдар", meaning: "ашық сары, жалы ақшыл"}
      - {term: "ала", meaning: "бірнеше түсті, шұбар"}
